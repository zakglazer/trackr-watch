name: Check Trackr

on:
  schedule:
    # All times UTC - cron cannot follow BST. The 07:00-17:59 UTC window covers
    # 08:00-18:00 UK in both winter (GMT) and summer (BST, where it runs an
    # hour later in local terms).
    #
    # Minutes are offset off :00/:15/:30/:45 because GitHub queues scheduled
    # jobs hardest on those marks, and free-tier runs get delayed or dropped
    # when the queue is busy.
    #
    # Weekday working hours: every 15 minutes.
    - cron: "7,22,37,52 7-17 * * 1-5"
    # Weekday nights: hourly.
    - cron: "7 0-6,18-23 * * 1-5"
    # Weekends: hourly.
    - cron: "7 * * * 0,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trackr-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Private-repo minutes are metered; don't let a wedged run burn the budget.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # No setup-python step: ubuntu-latest ships Python 3, and check.py is
      # stdlib-only. Skipping it keeps the job under the 1-minute billing round-up.
      - name: Check for openings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check.py

      - name: Commit snapshot
        run: |
          if [[ -z "$(git status --porcelain state/)" ]]; then
            echo "No state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "Update snapshot"
          git push
